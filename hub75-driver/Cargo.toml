[package]
name = "esp32c6-hub75-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Zero-CPU-scanout HUB75 LED matrix driver for ESP32-C6, built on the PARL_IO peripheral and a hand-rolled circular GDMA descriptor ring"
repository = "https://github.com/jfernand/esp-crates"
readme = "README.md"
keywords = ["esp32c6", "hub75", "led-matrix", "embedded", "esp-hal"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
esp-hal = { version = "1.1.0", features = ["defmt", "esp32c6", "unstable"] }
