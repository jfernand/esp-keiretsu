name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-bsp-crates:
    name: Publish bsp crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Build & clippy xiao-esp32c6-bsp
        working-directory: firmware
        run: |
          cargo build -p xiao-esp32c6-bsp
          cargo clippy -p xiao-esp32c6-bsp -- -D warnings

      - name: Build & clippy esp32c6-devkitm1-bsp
        working-directory: firmware
        run: |
          cargo build -p esp32c6-devkitm1-bsp
          cargo clippy -p esp32c6-devkitm1-bsp -- -D warnings

      - name: Publish xiao-esp32c6-bsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-if-new.sh xiao-esp32c6-bsp

      - name: Publish esp32c6-devkitm1-bsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-if-new.sh esp32c6-devkitm1-bsp
